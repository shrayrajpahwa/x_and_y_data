<script>
const D = JSON.parse(document.getElementById("payload").textContent);
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
$("meta").textContent = `#${String(D.number).padStart(3, "0")}   ${D.date}`;
$("title").textContent = `${D.title} ${D.emoji}`;
$("hyp").textContent = D.hypothesis;
$("vars").innerHTML = "";
[["X", D.x.detail], ["Y", D.y.detail]].forEach(([k, v]) => { const d = document.createElement("div"); d.innerHTML = `<b>${k}</b>`; d.append(v); $("vars").append(d); });
$("stats").innerHTML = D.stats.map(s => `<div>${s}</div>`).join("");
$("read").textContent = D.interpretation;
$("dl").innerHTML = `<a href="${D.post}">Read the post</a><a href="${D.files.xlsx}" download>Download .xlsx</a><a href="${D.files.csv}" download>Download .csv</a>`;
$("src").innerHTML = D.sources.map(s => `${s.name}: <a href="${s.url}">${s.cite}</a> (${s.licence})`).join("<br>");
if (D.note) $("note").textContent = D.note; else $("note").remove();
if (D.writeup && D.writeup.length) {
  D.writeup.forEach(t => {
    const h = document.createElement("h3"); h.textContent = t.head; $("wu").append(h);
    const ul = document.createElement("ul");
    t.items.forEach(b => { const li = document.createElement("li"); li.textContent = b; ul.append(li); });
    $("wu").append(ul);
  });
} else $("wu").remove();
$("back").href = D.substack; $("post").href = D.post;

const on = new Set(D.fits.filter(f => f.degree === 1 || f.degree === D.overfit).map(f => f.degree));
function traces() {
  const pts = D.chart === "box"
    ? { x: D.points.x, y: D.points.y, text: D.points.label, type: "box", name: "data", boxpoints: "all",
        jitter: 0.4, pointpos: 0, fillcolor: "rgba(0,0,0,0)", line: { color: css("--fit2"), width: 1.5 },
        marker: { color: css("--ink"), opacity: 0.35, size: 5 },
        hovertemplate: "%{text}<br>" + D.axes.y + ": %{y:.4g}<extra></extra>" }
    : { x: D.points.x, y: D.points.y, text: D.points.label, mode: "markers", type: "scatter", name: "data",
        marker: { color: css("--ink"), opacity: 0.55, size: 7 },
        hovertemplate: "%{text}<br>" + D.axes.x + ": %{x:.4g}<br>" + D.axes.y + ": %{y:.4g}<extra></extra>" };
  const lines = D.fits.filter(f => on.has(f.degree)).map(f => ({
    x: f.gx, y: f.gy, mode: "lines", type: "scatter", name: `${f.name} R² ${f.r2.toFixed(2)}`,
    line: f.degree === 1 ? { color: css("--accent"), width: 3 } : { color: css("--fit2"), width: 2, dash: "dash" },
    hovertemplate: `${f.name}<extra></extra>` }));
  return [pts, ...lines];
}
function layout() {
  const ax = t => ({ title: { text: t, font: { size: 13 } }, gridcolor: css("--line"), zeroline: false, color: css("--grey") });
  return { margin: { l: 64, r: 16, t: 16, b: 56 }, paper_bgcolor: css("--bg"), plot_bgcolor: css("--bg"),
    font: { family: "Inter, sans-serif", color: css("--ink") }, xaxis: ax(D.axes.x), yaxis: ax(D.axes.y),
    showlegend: false, hovermode: "closest",
    annotations: [{ xref: "paper", yref: "paper", x: D.slopeUp ? 0.01 : 0.99, y: 0.99, xanchor: D.slopeUp ? "left" : "right",
      yanchor: "top", showarrow: false, text: D.equation, font: { family: "JetBrains Mono, monospace", color: css("--accent"), size: 14 } }] };
}
function draw() { Plotly.react("chart", traces(), layout(), { displayModeBar: false, responsive: true }); }
D.fits.forEach(f => {
  const b = document.createElement("button");
  b.textContent = `${f.name} ${f.r2.toFixed(2)}`;
  b.setAttribute("aria-pressed", on.has(f.degree));
  b.onclick = () => { on.has(f.degree) ? on.delete(f.degree) : on.add(f.degree); b.setAttribute("aria-pressed", on.has(f.degree)); draw(); };
  $("toggles").append(b);
});
draw();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);

const cols = D.table.columns; let rows = D.table.rows.slice(); let sortCol = 0, asc = true;
function renderTable() {
  const head = "<tr>" + cols.map((c, i) => `<th data-i="${i}">${c}${i === sortCol ? (asc ? " ▲" : " ▼") : ""}</th>`).join("") + "</tr>";
  const body = rows.map(r => "<tr>" + r.map((v, i) => `<td>${i === 0 ? v : Number(v).toPrecision(5)}</td>`).join("") + "</tr>").join("");
  $("tbl").innerHTML = head + body;
  $("tbl").querySelectorAll("th").forEach(th => th.onclick = () => {
    const i = +th.dataset.i; asc = sortCol === i ? !asc : true; sortCol = i;
    rows.sort((a, b) => (a[i] > b[i] ? 1 : a[i] < b[i] ? -1 : 0) * (asc ? 1 : -1)); renderTable(); });
}
renderTable();
